<!-- Roamly Results Screen (Stitch ID: 95e4b6287e0f4578be6d565371e2a698) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B1220] text-[#FFF7ED] font-['Inter'] min-h-screen flex flex-col p-4 pb-12">
  <div class="max-w-md mx-auto w-full pt-4">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <a href="/home" class="w-10 h-10 rounded-full bg-[#19202E] border border-white/10 flex items-center justify-center text-white">←</a>
        <div>
          <h1 class="font-['Sora'] text-lg font-bold text-white">Kolkata → Darjeeling</h1>
          <p class="text-xs text-gray-400">14 Nov • 4 rides found</p>
        </div>
      </div>
      <div class="px-3 py-1 rounded-full bg-[#2DD4BF]/15 border border-[#2DD4BF]/40 text-[#2DD4BF] text-xs font-medium">
        Sleep well
      </div>
    </header>

    <!-- Ticket Stubs List -->
    <div class="flex flex-col gap-4">
      <!-- Ticket Stub 1 -->
      <div class="relative bg-[#19202E]/80 backdrop-blur-xl border border-white/10 rounded-3xl p-5 shadow-xl overflow-hidden">
        <!-- Glowing Best For You Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#2DD4BF]/20 border border-[#2DD4BF] text-[#2DD4BF] text-xs font-semibold mb-3 shadow-[0_0_12px_rgba(45,212,191,0.3)]">
          <span>✨ Best for you</span>
        </div>

        <div class="flex items-start justify-between mb-3">
          <div>
            <h2 class="font-['Sora'] text-base font-bold text-white">NBSTC Twilight Classic</h2>
            <div class="flex items-center gap-2 mt-1">
              <span class="text-xs text-amber-400 font-semibold">★ 4.8</span>
              <span class="text-xs text-gray-400">• AC Sleeper (2+1)</span>
            </div>
          </div>
          <div class="text-right">
            <span class="font-['Sora'] text-xl font-bold text-[#FF7A59]">₹1,150</span>
            <div class="text-[11px] text-gray-400">per seat</div>
          </div>
        </div>

        <!-- Timeline Row -->
        <div class="flex items-center justify-between py-3 border-y border-white/10 my-2">
          <div>
            <div class="font-['Sora'] text-sm font-semibold text-white">20:30</div>
            <div class="text-xs text-gray-400">Esplanade, KOL</div>
          </div>
          <div class="flex-1 flex flex-col items-center px-4">
            <span class="text-[11px] text-gray-400">11h 15m</span>
            <div class="w-full h-0.5 bg-gradient-to-r from-[#2DD4BF] to-[#FF7A59] relative my-1">
              <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-2.5 h-2.5 rounded-full bg-[#FF7A59]"></div>
            </div>
            <span class="text-[10px] text-[#2DD4BF]">Direct</span>
          </div>
          <div class="text-right">
            <div class="font-['Sora'] text-sm font-semibold text-white">07:45</div>
            <div class="text-xs text-gray-400">Mall Road, DAR</div>
          </div>
        </div>

        <!-- Comfort Tags and Seats Left -->
        <div class="flex items-center justify-between pt-2">
          <div class="flex gap-2">
            <span class="px-2 py-0.5 rounded-md bg-white/5 text-[11px] text-gray-300">Charging</span>
            <span class="px-2 py-0.5 rounded-md bg-white/5 text-[11px] text-gray-300">Blanket</span>
            <span class="px-2 py-0.5 rounded-md bg-white/5 text-[11px] text-gray-300">Water</span>
          </div>
          <!-- Seats left as dots -->
          <div class="flex items-center gap-1.5">
            <div class="flex gap-1">
              <span class="w-2 h-2 rounded-full bg-[#2DD4BF]"></span>
              <span class="w-2 h-2 rounded-full bg-[#2DD4BF]"></span>
              <span class="w-2 h-2 rounded-full bg-white/20"></span>
            </div>
            <span class="text-xs text-gray-300">6 left</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
