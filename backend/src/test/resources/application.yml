server:
  port: 8080

spring:
  application:
    name: smart-bus-backend-test
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:smartbus}
    password: ${DB_PASSWORD:smartbus_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.smartbus: DEBUG
    org.flywaydb: DEBUG

