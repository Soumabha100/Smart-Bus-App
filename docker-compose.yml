services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbus-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    container_name: smartbus-local-postgres
    environment:
      POSTGRES_DB: smartbus_local
      POSTGRES_USER: smartbus
      POSTGRES_PASSWORD: smartbus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbus -d smartbus_local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smartbus-local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
